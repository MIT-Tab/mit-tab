{% extends "base.html" %}
{% block content %}
<div class="col-12">
  <h1 class="h3">{{ title }}</h1>
  <p>{{ pairing.gov_team.name }} vs {{ pairing.opp_team.name }}</p>
  {% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf }}">
    <input type="hidden" name="round_instance" value="{{ id }}">
    <input type="hidden" name="revision" value="{{ revision }}">
    <label class="form-label">Winner
      <select class="custom-select" name="winner" required>
        <option value="">Choose an outcome</option>
        {% for id, label in [(1, "Government"), (2, "Opposition"), (3, "Government by forfeit"), (4, "Opposition by forfeit")] %}
        <option value="{{ id }}"{% if pairing.victor == id %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn btn-primary" type="submit">Save Ballot</button>
    <a class="btn btn-outline-secondary" href="/outround_pairing/{{ pairing.division }}/{{ pairing.num_teams }}">Cancel</a>
  </form>
</div>
{% endblock %}
