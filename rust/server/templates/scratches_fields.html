{% macro fields(prefix, draft, teams, judges) %}
<input type="hidden" name="{{ prefix }}id" value="{{ draft.id or '' }}">
<div class="row">
  <label class="col-md-4 form-label">Team
    <select class="custom-select" name="{{ prefix }}team" required>
      <option value="">Choose a team</option>
      {% for id, name in teams %}<option value="{{ id }}"{% if draft.team == id %} selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
  </label>
  <label class="col-md-4 form-label">Judge
    <select class="custom-select" name="{{ prefix }}judge" required>
      <option value="">Choose a judge</option>
      {% for id, name in judges %}<option value="{{ id }}"{% if draft.judge == id %} selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
  </label>
  <label class="col-md-4 form-label">Type
    <select class="custom-select" name="{{ prefix }}scratch_type">
      <option value="0"{% if draft.kind == 0 %} selected{% endif %}>Discretionary scratch</option>
      <option value="1"{% if draft.kind == 1 %} selected{% endif %}>Tab scratch</option>
    </select>
  </label>
</div>
{% endmacro %}
