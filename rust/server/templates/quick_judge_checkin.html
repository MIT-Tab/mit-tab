{% extends "base.html" %}
{% macro common(csrf, round, total) %}
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf }}">
<input type="hidden" name="redirect" value="on">
<label class="form-label">Round
  <select name="round_number" class="custom-select">
    {% for number in range(1, total + 1) %}<option value="{{ number }}"{% if number == round %} selected{% endif %}>Round {{ number }}</option>{% endfor %}
    <option value="0"{% if round > total %} selected{% endif %}>Outrounds</option>
  </select>
</label>
{% endmacro %}
{% block content %}
<div class="col-12">
  <h1 class="h3">{{ title }}</h1>
  <div class="row">
    <section class="col-md-6">
      <h2 class="h5">Existing Judge</h2>
      <form method="post">
        {{ common(csrf, round, total) }}
        <label class="form-label">Judge<select class="custom-select" name="judge_id" required>
          <option value="">Select a judge</option>{% for id, name in judges %}<option value="{{ id }}">{{ name }}</option>{% endfor %}
        </select></label>
        <button class="btn btn-primary" type="submit">Check In</button>
      </form>
    </section>
    <section class="col-md-6">
      <h2 class="h5">New Judge</h2>
      <form method="post">
        {{ common(csrf, round, total) }}
        <label class="form-label">Name<input name="name" class="form-control" required maxlength="30"></label>
        <label class="form-label">Rank<input name="rank" class="form-control" type="number" step="0.01" value="5.00"></label>
        <label class="form-label">School affiliations<select name="school_ids" class="custom-select" multiple>
          {% for id, name in schools %}<option value="{{ id }}">{{ name }}</option>{% endfor %}
        </select></label>
        <button class="btn btn-primary" type="submit">Create and Check In</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
