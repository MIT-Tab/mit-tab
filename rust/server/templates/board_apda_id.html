{% extends "base.html" %}
{% block content %}
<div class="readable-page col">
  <h2>{{ name }}</h2>
  {% include "board_nav.html" %}
  <form method="post" class="mb-4">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf }}">
    <label for="apda_id" class="form-label">APDA ID</label>
    <input class="form-control mb-3" name="apda_id" id="apda_id" type="number" value="{{ apda_id if apda_id is not none else '' }}">
    <button class="btn btn-primary" type="submit">Save APDA ID</button>
  </form>
  {% if teams %}
  <h3 class="h5">Teams</h3>
  <ul>{% for team in teams %}<li>{{ team.name }} · {{ team.school }}{% if team.hybrid %} / {{ team.hybrid }}{% endif %}</li>{% endfor %}</ul>
  {% endif %}
</div>
{% endblock %}
