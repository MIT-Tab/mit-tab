{% macro resource_fields(base, row, csrf, text=false) %}
<div class="d-flex gap-2 flex-wrap align-items-end">
  <form class="flex-grow-1" method="post" action="{{ base }}{% if row %}{{ row.id }}/{% endif %}">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf }}">
    <div class="row">
      <label class="col-md-4">Title<input class="form-control" name="title" value="{{ row.title or '' }}" required maxlength="80"></label>
      {% if text %}
      <label class="col-md-8">Text<input class="form-control" name="text" value="{{ row.description or '' }}" required maxlength="500"></label>
      {% else %}
      <label class="col-md-4">URL<input class="form-control" name="url" type="url" value="{{ row.url or '' }}" required maxlength="500"></label>
      <label class="col-md-4">Description<input class="form-control" name="description" value="{{ row.description or '' }}" maxlength="160"></label>
      {% endif %}
    </div>
    <div class="d-flex align-items-center flex-wrap gap-2">
      <label class="mb-0">Order <input class="form-control form-control-sm" name="display_order" type="number" min="0" value="{{ row.display_order or 0 }}"></label>
      <label class="mb-0"><input type="checkbox" name="is_active" {% if not row or row.active %}checked{% endif %}> Active</label>
      <button class="btn btn-sm btn-outline-primary" type="submit">{{ "Save" if row else "Add" }}</button>
    </div>
  </form>
  {% if row %}
  <form method="post" action="{{ base }}{{ row.id }}/delete/">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf }}">
    <button class="btn btn-sm btn-outline-danger" type="submit">Remove {{ row.title }}</button>
  </form>
  {% endif %}
</div>
{% endmacro %}
