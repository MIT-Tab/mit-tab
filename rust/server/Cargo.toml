[package]
name = "mittab-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["form", "http1", "json", "matched-path", "query", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
flate2 = "1.1.5"
hex = "0.4.3"
minijinja = "2.12"
ring = "0.17.14"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql-rsa", "tls-rustls", "chrono"] }
tower-http = { version = "0.6", features = ["fs"] }
unicode-normalization = "0.1.24"
url = "2.5.8"
tokio = { version = "1.48", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[dependencies.mittab-tabulation]
path = "../tabulation"
