[package]
name = "mittab-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
flate2 = "1.1.5"
hex = "0.4.3"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql-rsa", "tls-rustls", "chrono"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[dependencies.mittab-tabulation]
path = "../tabulation"
