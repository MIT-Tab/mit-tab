{% load static %}
<head>
  <link rel="stylesheet" href="{% static 'css/tab-cards-print.css' %}">
</head>

{% for card in cards %}
<h3>Team: {{ card.team_name }}</h3>
<div class="printable {% if forloop.counter|divisibleby:2 %}page_break_after{% endif %}">
  {% include "tab/tab_card.html" with print_view=True %}
</div>
{% endfor %}
